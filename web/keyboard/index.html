  <body>
    <!-- 加载屏由品牌 App 接管；页面在其后正常挂载，但暂不接受交互。 -->
    <div id="keyboard-startup" class="keyboard-startup" role="status" aria-live="polite">
      <!-- 与应用共用同一条键盘进度，避免等待 Vue 启动期间出现空白底色。 -->
      <p id="keyboard-startup-message"></p>
      <div
        id="keyboard-startup-progress"
        class="keyboard-startup-progress"
        role="progressbar"
        aria-label="键盘准备进度"
        aria-valuemin="0"
        aria-valuemax="4"
        aria-valuenow="2"
        data-stage="2"
      >
        <div class="keyboard-startup-fill"></div>
      </div>
      <div class="keyboard-startup-actions">
        <p id="keyboard-startup-help"></p>
        <a id="keyboard-startup-reload" href=""></a>
        <!-- 品牌插件在开发和构建时注入首页地址，加载失败也能回到当前品牌。 -->
        <a id="keyboard-startup-home" href="/"></a>
      </div>
    </div>
    <script id="keyboard-startup-locale">
      // 在应用模块下载前同步确定首屏语言，与品牌 locale.ts 使用相同配置和回退规则。
      (() => {
        const messages = {
          zh_CN: ['键盘已就绪，正在同步性能参数...', '键盘准备进度', '加载时间较长，可以重新加载或返回首页。', '重新加载', '返回首页'],
          en_US: ['Keyboard ready. Syncing performance settings...', 'Keyboard preparation progress', 'Loading is taking longer than expected. Reload or return home.', 'Reload', 'Return home'],
          ja_JP: ['キーボードの準備が完了しました。性能設定を同期しています...', 'キーボードの準備状況', '読み込みに時間がかかっています。再読み込みするか、ホームに戻ってください。', '再読み込み', 'ホームに戻る'],
          'ko-KR': ['키보드 준비 완료. 성능 설정을 동기화하는 중...', '키보드 준비 진행률', '로딩이 지연되고 있습니다. 새로고침하거나 홈으로 돌아가세요.', '새로고침', '홈으로 돌아가기']
        };
        /** 将浏览器语言映射到应用支持的语言代码。 */
        const normalize = language => {
          const code = language.trim().toLowerCase().split(/[-_]/)[0];
          return { zh: 'zh_CN', ja: 'ja_JP', ko: 'ko-KR' }[code] || 'en_US';
        };
        const browserLanguage = navigator.language || navigator.userLanguage || 'en-US';
        let locale = normalize(browserLanguage);
        try {
          // 首屏同步脚本不能直接导入公共包，此键值须与 LOCALE_STORAGE_KEY 保持一致。
          const saved = localStorage.getItem('sxyd:main-locale');
          if (saved !== null) {
            locale = Object.hasOwn(messages, saved)
              ? saved
              : normalize(navigator.languages?.[0] || browserLanguage);
          }
        } catch {
          // 存储不可用时沿用浏览器语言，不阻塞加载屏。
        }
        const [message, progress, help, reload, home] = messages[locale];
        document.documentElement.lang = locale.replace('_', '-');
        document.getElementById('keyboard-startup-message').textContent = message;
        document.getElementById('keyboard-startup-progress').setAttribute('aria-label', progress);
        document.getElementById('keyboard-startup-help').textContent = help;
        document.getElementById('keyboard-startup-reload').textContent = reload;
        document.getElementById('keyboard-startup-home').textContent = home;
      })();
    </script>
    <div id="app" inert></div>
    <script>
      window.global = window;
    </script>
  </body>
