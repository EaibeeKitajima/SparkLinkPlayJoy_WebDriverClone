  <!-- 在宿主握手、路由守卫和 Vue 挂载前立即显示，避免子应用首屏出现白屏。-->
  <div id="mouse-startup" class="mouse-startup" role="status" aria-live="polite">
    <p id="mouse-startup-message">正在连接鼠标…</p>
    <!-- 与键盘加载屏一样用阶段进度和流光表示准备过程，不伪造百分比。 -->
    <div
      id="mouse-startup-progress"
      class="mouse-startup-progress"
      role="progressbar"
      aria-label="鼠标准备进度"
      aria-valuemin="0"
      aria-valuemax="4"
      aria-valuenow="2"
      data-stage="2"
    >
      <div class="mouse-startup-fill"></div>
    </div>
  </div>
  <div id="app"></div>
